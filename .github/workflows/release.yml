name: Signed release

on:
  push:
    tags: ["[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"]
  workflow_dispatch:
    inputs:
      version:
        description: "Date version (YYYY.MM.DD). Manual runs produce a candidate without publishing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate trusted source before accessing signing secrets
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release reference and date
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = refs/heads/main
            version="$INPUT_VERSION"
          fi
          python3 scripts/validate_release_tag.py "$version"
          git merge-base --is-ancestor HEAD origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check source and all reachable Git history
        run: python3 scripts/check_public_source.py
      - name: Verify release validation fixtures
        run: python3 -m unittest discover -s scripts/tests -p 'test_release*.py'

  sign:
    name: Build, sign, notarize, and verify
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test models, privacy, and rollback protocol
        run: bash scripts/test_local.sh
      - name: Create signed and notarized DMG
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
          DRIVER_BUNDLE_ID: ${{ secrets.DRIVER_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          APP_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_PROVISIONING_PROFILE_BASE64 }}
          DRIVER_PROVISIONING_PROFILE_BASE64: ${{ secrets.DRIVER_PROVISIONING_PROFILE_BASE64 }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 scripts/release.py \
            --version "$RELEASE_VERSION" \
            --build "$((1000 + GITHUB_RUN_NUMBER))" \
            --output "$RUNNER_TEMP/release-artifacts"
      - name: Retain verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Lekuo-Control-${{ needs.preflight.outputs.version }}
          path: |
            ${{ runner.temp }}/release-artifacts/*.dmg
            ${{ runner.temp }}/release-artifacts/*.sha256
            ${{ runner.temp }}/release-artifacts/release.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified tag release
    if: github.ref_type == 'tag'
    needs: [preflight, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Lekuo-Control-${{ needs.preflight.outputs.version }}
          path: artifacts
      - name: Publish DMG, checksum, and build manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum -c "Lekuo-Control-$RELEASE_VERSION.dmg.sha256"
          cat > release-notes.md <<'NOTES'
          ## Experimental release

          Lekuo Control includes the Intel 82599 DriverKit driver and native control app.
          The app and disk image are Developer ID signed, notarized by Apple, and stapled.

          **Requirements:** macOS 27 or later on Apple silicon and compatible hardware.
          Testing has covered the Lekuo DTB3F21; this is not a production-support guarantee.

          Download the DMG, copy **Lekuo Control.app** to Applications, open it, and choose
          **Install Driver**. Complete the macOS approval or restart shown by the app.
          Keep an alternate network connection available during driver activation.

          Jumbo packets require a compatible network path. Selecting Standard or Jumbo
          applies and saves the local MTU after macOS authorization. Diagnostics offers
          an optional receiver test. See the repository README for hardware matching,
          benchmarks, limitations, and removal instructions.

          The SHA-256 file verifies download integrity; `release.json` identifies the
          source commit and build. Source archives are not installers.
          NOTES
          gh release create "$RELEASE_VERSION" \
            "Lekuo-Control-$RELEASE_VERSION.dmg" \
            "Lekuo-Control-$RELEASE_VERSION.dmg.sha256" release.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Lekuo Control $RELEASE_VERSION" --prerelease \
            --notes-file release-notes.md --generate-notes
